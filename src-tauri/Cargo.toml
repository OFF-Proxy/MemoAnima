[package]
name = "animemo"
version = "1.5.10"
description = "メモアニマ (MemoAnima) — 3DSのお絵かきアニメ作品をPCで編集・書き出しできる非公式・非営利のファンツール"
authors = ["arcana"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "animemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ライブラリ取り込み時の内容ハッシュ（SHA-256）で重複を判定するのに使う
sha2 = "0.10"

# V161 (B): 保存の gzip 圧縮を Rust 側で行う（level 3・スパイク実測 6.7 秒 vs JS 23.6 秒）。
# 出力はただの gzip なので読む側（JS の DecompressionStream・旧ビルド）は無改修
flate2 = "1"
hex = "0.4"

# U-1: アプリ内アップデート。**デスクトップだけ**に入れる（モバイルはストアが更新を配るので
# プラグイン自体が要らない・G-1 でモバイルを足すときにここを直さずに済む形にしておく）。
# 署名（minisign）は無効化できない仕様。公開鍵は tauri.conf.json、秘密鍵はビルド環境の環境変数。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- M12-1a: 起動時に applyI18n が document.title = t("app.title") を入れる。
         ウィンドウのタイトルバーは src-tauri/tauri.conf.json 側の値なのでここでは変わらない -->
    <title>MemoAnima</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- ============ ライブラリ（閲覧）画面 ============ -->
    <div id="screen-library" class="screen">
      <header class="topbar">
        <div class="logo">
          <!-- M12-1a: この要素は子（.mark / small / .ver）を持つので、テキストだけを span に切り出して data-i18n を振る -->
          <span class="mark"></span><span data-i18n="app.name.label"></span> <small>MemoAnima</small>
          <span id="app-meta" class="ver"></span>
        </div>
        <div class="spacer"></div>
        <div class="search">🔍<input id="lib-search" data-i18n-placeholder="lib.search.placeholder" /></div>
        <button class="btn blue" id="lib-import" type="button" data-i18n="lib.import.btn"></button>
        <button class="btn" id="lib-open-file" type="button" data-i18n="lib.openFile.btn" data-i18n-title="lib.openFile.title"></button>
        <button class="btn primary" id="lib-new-note" type="button" data-i18n="lib.newNote.btn"></button>
        <button class="btn" id="lib-change-dir" type="button" data-i18n-title="lib.settings.title">⚙</button>
      </header>

      <main class="lib-main">
        <!-- 左: アルバム（＝実フォルダ・ファイル管理） -->
        <nav class="card albums">
          <!-- M12-1a: h2 は子（.albbtns）を持つので、見出しの文字だけ span に切り出す -->
          <h2><span data-i18n="lib.albums.label"></span>
            <span class="albbtns">
              <button class="minibtn" id="album-add" type="button" data-i18n-title="lib.album.add.title">＋</button>
              <button class="minibtn" id="album-rename" type="button" data-i18n-title="lib.album.rename.title">✎</button>
              <button class="minibtn" id="album-delete" type="button" data-i18n-title="lib.album.delete.title">🗑</button>
            </span>
          </h2>
          <div id="albums-list"></div>
          <p class="dnd-hint" data-i18n="lib.dndHint.hint"></p>
        </nav>

        <!-- 中央: ビューア -->
        <section class="card stage">
          <div class="stage-top">
            <span class="title" id="stage-title" data-i18n="lib.stage.empty.label"></span>
            <span class="author" id="stage-author"></span>
          </div>
          <div class="screen-view">
            <div id="player-host"></div>
            <canvas id="preview-host" width="320" height="240" hidden></canvas>
          </div>
          <div class="controls">
            <div class="transport">
              <button class="rbtn" id="tp-restart" type="button" data-i18n-title="lib.tp.restart.title">⏮</button>
              <!-- M11-17: コマ送り（←/→ キーと同じ。再生中は一時停止してから1コマ・端はループ） -->
              <button class="rbtn" id="tp-prev" type="button" data-i18n-title="lib.tp.prev.title">◀</button>
              <button class="rbtn play" id="tp-play" type="button" data-i18n-title="lib.tp.play.title">▶</button>
              <button class="rbtn" id="tp-next" type="button" data-i18n-title="lib.tp.next.title">▶</button>
              <button class="rbtn" id="tp-loop" type="button" data-i18n-title="lib.tp.loop.title">🔁</button>
            </div>
            <div class="meta-row" id="stage-meta"></div>
          </div>
        </section>

        <!-- 右: サムネ棚 -->
        <aside class="card shelf">
          <div class="shelf-head">
            <span class="t" id="shelf-title"></span>
            <!-- M10-20: 並び順（手動=従来／名前順／日付順。選択はアプリ設定に保存） -->
            <select id="shelf-sort" data-i18n-title="lib.sort.title">
              <option value="manual" data-i18n="lib.sort.manual.label"></option>
              <option value="name" data-i18n="lib.sort.name.label"></option>
              <option value="date" data-i18n="lib.sort.date.label"></option>
            </select>
            <span class="c" id="shelf-count"></span>
          </div>
          <div class="grid" id="shelf-grid"></div>
        </aside>
      </main>

      <!-- 下: 取り込み進捗バー -->
      <footer id="import-footer" hidden>
        <!-- M12-1a: #import-label は取り込み中に library.ts が書き換える**動的なノード**なので
             data-i18n を振らない（言語切替の applyI18n が進捗表示を初期値へ戻してしまうため）。
             初期値は起動時に main.ts が t() で入れる。footer は hidden なので空でも見た目は変わらない -->
        <span class="label" id="import-label"></span>
        <div class="bar"><i id="import-bar-fill"></i></div>
        <span class="pct" id="import-count"></span>
        <button class="btn" id="lib-cancel-import" type="button" data-i18n="imp.cancel.btn"></button>
      </footer>
    </div>

    <!-- ============ エディタ画面 ============ -->
    <div id="screen-editor" class="screen" hidden>
      <header class="edbar">
        <button class="ic" id="ed-back" type="button" data-i18n-title="ed.back.title">←</button>
        <!-- M12-1a: #ed-title は作品を開くと editor.ts が書き換える**動的なノード**なので data-i18n を振らない。
             初期値は起動時に main.ts が t() で入れる（エディタ画面は hidden で開くので空でも見た目は変わらない） -->
        <div class="h-title" id="ed-title"></div>
        <button class="ic" id="ed-undo" type="button" data-i18n-title="ed.undo.title">↶</button>
        <button class="ic" id="ed-redo" type="button" data-i18n-title="ed.redo.title">↷</button>
        <div class="sp"></div>
        <div class="h-spec" data-i18n="ed.spec.label"></div>
        <div class="sp"></div>
        <button class="hb green" id="ed-save" type="button" data-i18n="ed.save.btn"></button>
        <button class="hb" id="ed-saveas" type="button" data-i18n="ed.saveAs.btn" data-i18n-title="ed.saveAs.title"></button>
        <button class="hb" id="ed-export" type="button" data-i18n="ed.export.btn" data-i18n-title="ed.export.title"></button>
        <button class="hb" id="ed-imgexport" type="button" data-i18n="ed.imgExport.btn" data-i18n-title="ed.imgExport.title"></button>
      </header>

      <main class="ed-main">
        <!-- 左: 道具（M11-18: 畳むと .ed-tab（つまみ）だけが残る。つまみは buildToolsPanel が消さない位置＝カード直下の最後） -->
        <div class="card tools" id="ed-tools"></div>
        <!-- M11-17: スプリッター3本（列2・列4・行2 の隙間トラック）。ドラッグで幅/高さ・ダブルクリックで既定 -->
        <div class="ed-split v" id="ed-split-tools" data-i18n-title="ed.split.tools.title"></div>
        <div class="ed-split v" id="ed-split-side" data-i18n-title="ed.split.side.title"></div>
        <div class="ed-split h" id="ed-split-tl" data-i18n-title="ed.split.tl.title"></div>

        <!-- 中央: キャンバス（M3.9 H-1: スクロールは #ed-scroll に限定し、HUDは stage 直下で固定） -->
        <div class="card stage" id="ed-stage">
          <div class="stage-scroll" id="ed-scroll">
            <div class="cvwrap" id="ed-cvwrap">
              <canvas id="ed-canvas" width="320" height="240"></canvas>
              <canvas id="ed-overlay" width="320" height="240"></canvas>
              <!-- M3.10 G-1: 格子は canvas 化（実測ピッチ×devicePixelRatio の物理pxに線を引く） -->
              <canvas class="pxgrid" id="ed-grid" hidden></canvas>
              <!-- M12-C: カーソル層（ペン先の輪・ドット枠）。格子と同じく画面解像度で描く。
                   #ed-overlay は 320×240 のドット解像度なので 1ドット未満の細い線が出せない -->
              <canvas id="ed-cursor" hidden></canvas>
              <!-- M13-2b (T-6): 変形・四隅の枠とハンドル。格子・カーソル層と同じく画面解像度で描く
                   （#ed-overlay に引くとズーム倍の太線になる）。ドット粒度のもの（アンツ・色マスク・
                   変形プレビューの絵）は #ed-overlay に残す -->
              <canvas id="ed-overlay-ui" hidden></canvas>
              <div class="drawguide"></div>
            </div>
          </div>
          <div class="cvbadge" id="ed-badge"></div>
          <div class="xform-badge" id="ed-xform-badge" data-i18n="ed.xform.badge.label" hidden></div>
          <div class="cvright">
            <button class="ic" id="ed-view-rot" type="button" data-i18n-title="ed.view.rotate.title">🔄</button>
            <button class="ic" id="ed-view-flip" type="button" data-i18n-title="ed.view.flip.title">↔</button>
            <button class="ic" id="ed-zoom-in" type="button" data-i18n-title="ed.zoom.in.title">＋</button>
            <button class="ic" id="ed-zoom-out" type="button" data-i18n-title="ed.zoom.out.title">−</button>
            <!-- M11-13→M11-16: プレビュー・コマ番号・倍率をまとめて隠す/出す（統合トグル）。
                 **隠す対象の外＝この列**に置く（隠したあとに戻す手段が消えないように） -->
            <button class="ic" id="ed-mini-toggle" type="button" data-i18n-title="ed.mini.toggle.title">🖼</button>
            <!-- M11-18: キャンバス集中（3パネルを一括で畳む/戻す）。つまみは畳んでも見えるので戻す手段は消えない -->
            <button class="ic" id="ed-focus-toggle" type="button" data-i18n-title="ed.focus.toggle.title">⛶</button>
          </div>
          <div class="zoominfo" id="ed-zoominfo"></div>
          <div class="mini" id="ed-mini" data-i18n-title="ed.mini.title">
            <span class="tg" data-i18n="ed.mini.label"></span>
            <canvas id="ed-mini-canvas" width="320" height="240"></canvas>
          </div>
        </div>

        <!-- 右: ペン設定・色・レイヤー・描き味 -->
        <div class="card side" id="ed-side"></div>

        <!-- 下: タイムライン（M11-18: 見出しは常に1行・あふれは「…」へ。本体は「収納ミニ＋フィルム帯」の横並び） -->
        <div class="card timeline" id="ed-timeline">
          <div class="tl-head" id="ed-tlhead"></div>
          <div class="tl-body" id="ed-tlbody">
            <!-- 収納ミニの置き場（miniDock=timeline のとき #ed-mini がここへ移る。空なら幅0） -->
            <div class="tl-mini-slot" id="ed-mini-slot"></div>
            <div class="film" id="ed-film"></div>
          </div>
        </div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-host"></div>
  </body>
</html>
